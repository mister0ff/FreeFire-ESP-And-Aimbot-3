name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build (assembleDebug ou assembleRelease)"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project root
        id: root
        run: |
          if [ -f "gradlew" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "FreeFire-ESP-And-Aimbot-3-po/gradlew" ]; then
            echo "project_dir=FreeFire-ESP-And-Aimbot-3-po" >> "$GITHUB_OUTPUT"
          else
            echo "Erro: gradlew não encontrado."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Ensure local.properties exists
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          if [ ! -f "$PROJECT_DIR/local.properties" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Replace deprecated jcenter() in Gradle files
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          find "$PROJECT_DIR" -name "*.gradle" -exec sed -i 's/\bjcenter()\b/mavenCentral()/g' {} +

      - name: Build APK
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          TASK="${{ github.event.inputs.build_type || 'assembleDebug' }}"
          cd "$PROJECT_DIR"
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew "$TASK" --stacktrace
          else
            gradle "$TASK" --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            ${{ steps.root.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
