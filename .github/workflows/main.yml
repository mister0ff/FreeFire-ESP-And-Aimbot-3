name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build (assembleDebug ou assembleRelease)"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project root
        id: root
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Erro: gradlew não encontrado."
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Android em: $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Ensure local.properties exists
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          if [ ! -f "$PROJECT_DIR/local.properties" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          fi

      - name: Grant execute permission to gradlew
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Replace deprecated jcenter() in Gradle files
        run: |
          PROJECT_DIR="${{ steps.root.outputs.project_dir }}"
          find "$PROJECT_DIR" \( -name "*.gradle" -o -name "*.gradle.kts" \) -type f \
            -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          echo "Ocorrências restantes de jcenter():"
          grep -rn "jcenter()" "$PROJECT_DIR" --include="*.gradle" --include="*.gradle.kts" || echo "nenhuma"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: |
          TASK="${{ github.event.inputs.build_type || 'assembleDebug' }}"
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew "$TASK" --stacktrace --no-daemon
          else
            gradle "$TASK" --stacktrace --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.root.outputs.project_dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
